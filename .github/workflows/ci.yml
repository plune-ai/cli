name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Install → Lint → Typecheck → Test → Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        # Skip onnxruntime-node's large CUDA EP download — the bundled CPU build is all we need,
        # and the GPU binding fails to load on CPU-only runners (see .npmrc).
        run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # What this pull request changes in the tool contract that `plune mcp serve` and the platform's built-in agent
      # share, classified, in the run summary. A breaking change does not fail this step: the snapshot test fails until
      # contracts/plune-mcp-tools.snapshot.json is updated on purpose, and then this summary shows what was changed.
      # Right after install, so the summary is written even when a later step fails. The checkout is shallow, so the
      # base branch is fetched here. A failed fetch, no snapshot on the base, or a comparison that could not run each
      # says so in the summary, and the step passes.
      - name: Tool contract — changes against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base_file="$RUNNER_TEMP/base-tools.snapshot.json"
          snapshot=contracts/plune-mcp-tools.snapshot.json
          if ! git fetch --no-tags --depth=1 origin "$BASE_REF"; then
            printf '### Tool contract\n\nCould not fetch the base branch; contract changes not compared.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git cat-file -e "FETCH_HEAD:$snapshot" 2>/dev/null; then
            git show "FETCH_HEAD:$snapshot" > "$base_file"
          fi
          pnpm exec tsx src/mcp-testing/contract-summary.ts "$base_file" >> "$GITHUB_STEP_SUMMARY" \
            || echo "The tool contract could not be compared: see the step log." >> "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The compile-time pins on the frozen public surface live in `src/types/__tests__/`, and the
      # root tsconfig excludes `**/*.test.ts`. Without this step the golden contract test compiles
      # in nobody's build, so a field added to a public type without a schemaVersion bump would go
      # unnoticed — exactly the break the pins exist to catch.
      - name: Typecheck gates (public contract pins)
        run: pnpm typecheck:gates

      - name: Test (with coverage)
        run: pnpm test

      - name: Build
        run: pnpm build

      # Our own MCP server, checked by our own commands: `plune mcp lint`, `plune mcp check` (static, no tool is
      # called) and `plune mcp conformance` against the built `plune mcp serve` as a real process, all three from
      # scripts/mcp-self-check.mjs (src/mcp/__tests__/self-check.e2e.test.ts proves it red on a broken server). The
      # token is made up and the platform address leads nowhere: listing the tools needs neither, so this needs no
      # secret and no network. Every command runs even when one is red, so every report is written; the step fails on
      # the first non-zero exit (1 a finding, 2 the server did not start, 3 nothing measured, such as an empty tool
      # list). No model is called: the script refuses to run with a provider key set.
      - name: MCP — self-checks against the built server
        env:
          PLUNE_TOKEN: ci-placeholder-not-a-token
          PLUNE_API_URL: http://127.0.0.1:9
        run: >-
          node scripts/mcp-self-check.mjs "$RUNNER_TEMP/mcp-reports"
          --env PLUNE_TOKEN --env PLUNE_API_URL -- node dist/cli.cjs mcp serve

      - name: MCP — self-check reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mcp-self-check-junit
          path: ${{ runner.temp }}/mcp-reports/
          if-no-files-found: warn

      # Drives the built binary (dist/cli.cjs) against stub servers on localhost; needs no secrets or network.
      - name: End-to-end — built binary
        # Not `pnpm test:e2e`: that runs tsup again, right after Build.
        run: pnpm exec vitest run -c vitest.e2e.config.ts

      # After Build: the adapter typechecks against the root's emitted .d.ts and bundles the
      # reporter core out of the root's dist. Its own `test` script builds it first, which is
      # what lets the packaging guard assert against a real artifact instead of an intention.
      - name: Adapter — typecheck, build, test
        run: |
          pnpm typecheck:playwright
          pnpm test:playwright
          pnpm test:e2e:playwright

      - name: Smoke — built binary + library entry
        run: |
          node dist/cli.cjs --version
          node -e "const m = require('./dist/index.cjs'); if (typeof m.run !== 'function') throw new Error('index.cjs did not export run()');"
