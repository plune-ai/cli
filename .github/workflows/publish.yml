name: Publish to npm and GitHub Packages

# Triggered directly by the version tag push (a real user event) so it actually runs — a Release
# created by release.yml uses GITHUB_TOKEN, which does NOT trigger other workflows. `release:`
# (manual UI releases) and `workflow_dispatch` are kept as alternative entry points.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0). Must match the version in package.json."
        required: true

permissions:
  contents: read # read-only access to code — nothing is committed back to the repo
  id-token: write # npm provenance (OIDC signing)
  packages: write # publish to GitHub Packages

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.target_commitish || github.ref }}

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        # Skip onnxruntime-node's CUDA EP download (the bundled CPU build is all we need; see .npmrc).
        run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      # --- Tag is the source of truth: set package.json version from the tag before publishing.
      # (No manual `npm version` needed — just push a vX.Y.Z tag. The change is ephemeral to this
      # CI run; the repo's package.json is a baseline.) ---
      - name: Set version from tag
        run: |
          npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version --allow-same-version
          echo "package.json version set to $(node -p "require('./package.json').version")"

      # --- Checks (mirror of ci.yml): never publish a red build ---
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (coverage gate)
        run: pnpm test
      - name: Build
        run: pnpm build
      # The adapter typechecks against the root's emitted .d.ts and bundles the reporter core out
      # of the root's dist, so it can only run after Build. Mirrors ci.yml — never publish a red build.
      - name: Adapter - typecheck, build, test
        run: |
          pnpm typecheck:playwright
          pnpm test:playwright
          pnpm test:e2e:playwright

      # --- Determine npm dist-tag (alpha/beta/rc/latest) from the tag / prerelease flag ---
      - name: Determine npm dist-tag
        id: dist
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if   echo "$TAG" | grep -qE "alpha|-alpha|\.a\."; then echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -qE "beta|-beta|\.b\.";  then echo "tag=beta"  >> "$GITHUB_OUTPUT"
          elif echo "$TAG" | grep -qE "rc|-rc|\.rc\.";     then echo "tag=rc"    >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.release.prerelease }}" = "true" ]; then echo "tag=beta" >> "$GITHUB_OUTPUT"
          else echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # --- Phase 1: GitHub Packages (no provenance) — idempotent ---
      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@plune-ai"
      - name: Publish to GitHub Packages
        run: |
          VER="${{ steps.meta.outputs.version }}"
          if npm view "@plune-ai/cli@$VER" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@plune-ai/cli@$VER already in GitHub Packages — skipping (idempotent)."
          else
            npm pkg set publishConfig.registry=https://npm.pkg.github.com
            npm publish --tag ${{ steps.dist.outputs.tag }}
            npm pkg delete publishConfig.registry
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      # The adapter has its own version line: the tag governs @plune-ai/cli, and bumping the adapter
      # is an ordinary commit. So its version comes from its own package.json, not from the tag.
      #
      # `pnpm publish`, not `npm publish`: the adapter depends on the CLI through `workspace:*`, and
      # npm ships package.json verbatim — that range would reach the registry as an unresolvable
      # dependency. pnpm rewrites it to the real version while packing.
      - name: Publish adapter to GitHub Packages
        working-directory: packages/playwright
        run: |
          VER="$(node -p "require('./package.json').version")"
          if npm view "@plune-ai/playwright@$VER" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@plune-ai/playwright@$VER already in GitHub Packages - skipping (idempotent)."
          else
            npm pkg set publishConfig.registry=https://npm.pkg.github.com
            pnpm publish --no-git-checks --tag ${{ steps.dist.outputs.tag }}
            npm pkg delete publishConfig.registry
          fi
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      # --- Phase 2: npm registry (with provenance) — idempotent ---
      # scope MUST be re-set here: otherwise @plune-ai:registry from Phase 1 (.npmrc) still points at
      # GitHub Packages and the scoped `npm publish` would NOT go to npmjs.
      - name: Setup Node for npm
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@plune-ai"
      - name: Publish to npm
        run: |
          VER="${{ steps.meta.outputs.version }}"
          if npm view "@plune-ai/cli@$VER" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@plune-ai/cli@$VER already on npm — skipping (idempotent)."
          else
            npm publish --provenance --tag ${{ steps.dist.outputs.tag }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish adapter to npm
        working-directory: packages/playwright
        run: |
          VER="$(node -p "require('./package.json').version")"
          if npm view "@plune-ai/playwright@$VER" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@plune-ai/playwright@$VER already on npm - skipping (idempotent)."
          else
            pnpm publish --no-git-checks --provenance --tag ${{ steps.dist.outputs.tag }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- Phase 3: tell the site the version moved ---
      # docs.plune.ai prints the current CLI version from a file refreshed at BUILD time, so until
      # the site is rebuilt it keeps showing whatever was current at its last deploy. That file sat
      # on 0.6.0 for a month while npm went through three releases, and nothing was wrong with it —
      # nobody had deployed the site.
      #
      # `latest` only: the refresh script reads the `latest` dist-tag, so an alpha or rc would
      # redeploy the site to show the same number it already shows.
      #
      # Never fails the release. By this point the package is published and unpublishing is not a
      # thing; a stale version number on a page is not worth a red release. Without the token the
      # step says so out loud — a step that skips quietly is how the gap survived the first time.
      - name: Refresh the version shown on docs.plune.ai
        if: steps.dist.outputs.tag == 'latest'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEB_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::No WEB_SITE_DISPATCH_TOKEN: docs.plune.ai keeps showing the previous version until its next deploy. To arm this, add a fine-grained PAT with Actions:write on plune-ai/web-site as this repo's WEB_SITE_DISPATCH_TOKEN."
            exit 0
          fi
          gh workflow run deploy.yml --repo plune-ai/web-site --ref main
          echo "Dispatched plune-ai/web-site deploy.yml - the site will pick up ${{ steps.meta.outputs.version }} on that build."
