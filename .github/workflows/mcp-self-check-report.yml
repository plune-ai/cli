name: MCP self-checks — report

# The record of the MCP self-checks that CI runs as a gate (ci.yml, "MCP — self-checks against the built server"):
# the same two commands, nightly and by hand, their JUnit imported into Plune. Never on a push or a pull request: the
# gate does not need the platform, and a fork has no secret.
#
# PLUNE_DOGFOOD_TOKEN (a repository secret) is a token of the project the results go to; the project is the token's,
# so it is named nowhere here. PLUNE_DOGFOOD_API_URL (a repository variable) points at another deployment. Without
# the secret the workflow says so in its summary and passes.

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-self-check-report
  cancel-in-progress: false

jobs:
  report:
    name: Lint and check the built server, import the JUnit into Plune
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Reporting token
        id: token
        env:
          PLUNE_DOGFOOD_TOKEN: ${{ secrets.PLUNE_DOGFOOD_TOKEN }}
        run: |
          if [ -z "$PLUNE_DOGFOOD_TOKEN" ]; then
            echo "no PLUNE_DOGFOOD_TOKEN, nothing reported" >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.token.outputs.present == 'true'

      - name: Setup pnpm
        if: steps.token.outputs.present == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Build
        if: steps.token.outputs.present == 'true'
        run: pnpm build

      # The same commands as the CI step; the token here is made up too, the real one is only in the import step.
      - name: MCP — self-checks against the built server
        if: steps.token.outputs.present == 'true'
        env:
          PLUNE_TOKEN: ci-placeholder-not-a-token
          PLUNE_API_URL: http://127.0.0.1:9
        run: |
          if env | grep -qE '^[A-Z0-9_]*_API_KEY='; then
            echo "A model provider key is set in this step: these checks must not reach a model." >&2
            env | grep -oE '^[A-Z0-9_]*_API_KEY' >&2
            exit 1
          fi
          out="$RUNNER_TEMP/mcp-reports"
          mkdir -p "$out"
          server=(--env PLUNE_TOKEN --env PLUNE_API_URL -- node dist/cli.cjs mcp serve)
          status=0
          node dist/cli.cjs mcp lint --reporter junit-xml --out "$out/lint.xml" "${server[@]}" || status=1
          node dist/cli.cjs mcp check --reporter junit-xml --out "$out/check.xml" "${server[@]}" || status=1
          exit $status

      - name: MCP — self-check reports
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: mcp-self-check-junit
          path: ${{ runner.temp }}/mcp-reports/
          if-no-files-found: warn

      # Red checks are reported too: that is what the record is for. Without --create: a check the project has no case
      # for is not offered to the review queue on every night.
      - name: Import into Plune
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' }}
        env:
          PLUNE_TOKEN: ${{ secrets.PLUNE_DOGFOOD_TOKEN }}
          PLUNE_API_URL: ${{ vars.PLUNE_DOGFOOD_API_URL || 'https://beta-api.plune.ai' }}
        run: |
          out="$RUNNER_TEMP/mcp-reports"
          if ! ls "$out"/*.xml > /dev/null 2>&1; then
            echo "No JUnit report was written, so nothing was imported: see the steps above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node dist/cli.cjs run import "$out" --name "MCP self-checks" \
            --key "mcp-self-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
