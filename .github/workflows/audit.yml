name: Dependency audit

# The schedule catches a new advisory against an unchanged dependency, which no gate that fires on a change can see.
# The pull request run fires only when the dependency set changes.
on:
  pull_request:
    branches: [main]
    paths:
      - pnpm-lock.yaml
      - '**/package.json'
      - .github/workflows/audit.yml
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (runtime dependencies, HIGH and above)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: pnpm/action-setup@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Reads pnpm-lock.yaml; nothing is installed. --prod: dev-only advisories are in tooling that is not shipped in
      # the package.
      - run: pnpm audit --prod --audit-level high
