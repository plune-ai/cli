# Plune quickstart config — verified against @plune-ai/cli@0.2.2.
#
# Two layers of evals:
#   tag: offline  — pass with the built-in mock provider (PLUNE_MOCK_PROVIDER=1). No API key,
#                   zero cost, deterministic. Run: plune run -c plune.yaml --only=tag:offline
#   tag: online   — call a real provider (Anthropic). Need ANTHROPIC_API_KEY in .env.
#
# Tag selector syntax is `--only=tag:<name>` (the `tag:` prefix is required; a bare name matches
# an eval id). Assertion params interpolate only {{expected}} and {{vars.X}} — not bare {{x}}.
version: 1
provider:
  type: anthropic
  model: claude-sonnet-4-6

# Cost tracking (optional). Without this, cost_usd is reported as 0 for unknown models.
pricing:
  claude-sonnet-4-6:
    input_per_1k_usd: 0.003
    output_per_1k_usd: 0.015

evals:
  # ── OFFLINE CORE ─────────────────────────────────────────────────────────────────────────────
  # The mock provider returns the fixed string "mock response" for every row, so these assert
  # against that literal. They prove the harness + CI wiring run end-to-end with no key and no cost.
  - id: smoke-exact
    description: "Deterministic smoke test (exact-match) against the mock provider output."
    tags: [offline]
    prompt: "{{q}}"
    dataset:
      examples:
        - vars: { q: "ping" }
    assertions:
      - type: exact-match
        value: "mock response"   # the mock provider's fixed output

  - id: smoke-contains
    description: "Deterministic smoke test (contains-all)."
    tags: [offline]
    prompt: "{{q}}"
    dataset:
      examples:
        - vars: { q: "ping" }
    assertions:
      - type: contains-all
        values: ["mock", "response"]

  - id: smoke-similarity
    description: "Local-embedding similarity (no API key; downloads a small embedding model once)."
    tags: [offline]
    prompt: "{{q}}"
    dataset:
      examples:
        - vars: { q: "ping" }
    assertions:
      - type: semantic-similarity
        reference: "mock response"
        threshold: 0.5

  # ── ONLINE ───────────────────────────────────────────────────────────────────────────────────
  # These need ANTHROPIC_API_KEY (real model output). Run: plune run -c plune.yaml --only=tag:online
  - id: extraction-schema
    description: "Extract structured fields and validate the JSON against a schema."
    tags: [online]
    prompt: |
      Extract the person's full name and age from the text.
      Respond with ONLY a JSON object: {"name": <string>, "age": <number>}.
      Text: {{text}}
    dataset: datasets/extraction.jsonl
    assertions:
      - type: json-schema
        extract: auto
        schema:
          type: object
          required: [name, age]
          additionalProperties: false
          properties:
            name: { type: string }
            age: { type: number }

  - id: faq-contains
    description: "Grounded answer contains an expected key term from the context."
    tags: [online]
    prompt_file: prompts/system.md
    dataset: datasets/faq.jsonl
    assertions:
      - type: contains
        value: "{{expected}}"     # per-row expected term (from faq.jsonl)
        ignore_case: true

  # Interpretable judge (BINEVAL-style): the verdict is split into atomic binary criteria, each its
  # own llm-judge assertion, so a PR reviewer can read exactly WHICH criterion regressed.
  - id: faq-tone-judge
    description: "Binary, interpretable judge — one criterion per assertion."
    tags: [online]
    prompt_file: prompts/system.md
    dataset: datasets/faq.jsonl
    assertions:
      - type: llm-judge
        criteria: "Score 1 if the answer is polite with no rude or dismissive tone, else 0."
      - type: llm-judge
        criteria: "Score 1 if the answer is three sentences or fewer, else 0."
      - type: llm-judge
        # The judge only sees the OUTPUT + this criteria string — interpolate the question in,
        # or it has nothing to check the answer against.
        criteria: "Score 1 if the answer directly addresses this question, else 0: {{vars.question}}"
      - type: llm-judge
        criteria: "Score 1 if the answer invents no facts beyond this context, else 0: {{vars.context}}"

  - id: rag-faithfulness
    description: "RAG checks: answer is grounded in (faithful to) the context and relevant to the question."
    tags: [online]
    prompt_file: prompts/system.md
    dataset: datasets/faq.jsonl
    assertions:
      - type: faithfulness
        context: "{{vars.context}}"
        threshold: 0.7
      - type: answer-relevance
        question: "{{vars.question}}"
        threshold: 0.5   # local-embedding relevance scores grounded answers ~0.55; 0.5 is a sane gate
